name: SECOP II Monitoring Agent

on:
  schedule:
    # Morning Sweep: 8:30 AM Colombia Time (UTC-5) = 13:30 UTC
    - cron: '30 13 * * *'
    # Afternoon Peak Sweep: 4:30 PM Colombia Time (UTC-5) = 21:30 UTC
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  secop-monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install requests gspread google-auth
      
      - name: Run SECOP II Agent
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python secop_agent.py
