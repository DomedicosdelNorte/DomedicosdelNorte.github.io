name: SECOP II Monitoring Agent

on:
  schedule:
    # Run at 12:00 and 19:00 UTC daily
    - cron: '0 12,19 * * *'
  workflow_dispatch:

jobs:
  secop-monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install requests gspread google-auth
      
      - name: Run SECOP II Agent
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python secop_agent.py
